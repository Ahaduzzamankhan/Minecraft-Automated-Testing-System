name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (for example v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  build:
    name: Build ${{ matrix.asset }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: windows-x86_64
            ext: ".exe"
            verify: true
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            asset: windows-aarch64
            ext: ".exe"
            verify: true
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: linux-x86_64
            ext: ""
            verify: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            asset: linux-aarch64
            ext: ""
            # Cross-compiled: cannot execute the ARM64 binary on the x86 runner
            verify: false
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: macos-x86_64
            ext: ""
            # Cross-compiled on the ARM runner; Rosetta is not guaranteed
            verify: false
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: macos-aarch64
            ext: ""
            verify: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          case "$tag" in
            v*) ;;
            *) tag="v$tag" ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install the ARM64 Linux cross linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        shell: bash
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --locked --target "${{ matrix.target }}"

      - name: Stage the release asset
        shell: bash
        run: |
          set -euo pipefail
          source="target/${{ matrix.target }}/release/mats"
          if [ -f "${source}.exe" ]; then source="${source}.exe"; fi
          dest="dist/mats-${{ steps.version.outputs.tag }}-${{ matrix.asset }}${{ matrix.ext }}"
          mkdir -p dist
          cp "$source" "$dest"
          if [ "${{ runner.os }}" != "Windows" ]; then chmod +x "$dest"; fi
          if [ "${{ matrix.verify }}" = "true" ]; then
            # Prove the staged binary runs on this platform before publishing.
            "$dest" --version
          fi
          (cd dist && sha256sum "$(basename "$dest")" > "$(basename "$dest").sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: mats-${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish the GitHub release
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          case "$tag" in
            v*) ;;
            *) tag="v$tag" ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create checksum manifest
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          ls -l
          # Every platform must have produced an asset; a missing one fails here.
          expected="windows-x86_64.exe windows-aarch64.exe linux-x86_64 linux-aarch64 macos-x86_64 macos-aarch64"
          for platform in $expected; do
            if ! ls "mats-${{ steps.version.outputs.tag }}-${platform}" >/dev/null 2>&1; then
              echo "missing release asset for ${platform}" >&2
              exit 1
            fi
          done
          sha256sum mats-* > SHA256SUMS
          cat SHA256SUMS

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          prerelease=()
          case "$TAG" in *-*) prerelease=(--prerelease) ;; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "MATS $VERSION" \
              --generate-notes \
              "${prerelease[@]}"
          fi
